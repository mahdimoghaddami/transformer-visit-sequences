[project]
name = "transformer-visit-sequences"
version = "0.1.0"
description = "Next-visit Alzheimer's disease diagnosis from longitudinal clinical visits"
readme = "README.md"
authors = [{ name = "Mahdi Moghaddami", email = "mahdiman10@gmail.com" }]
requires-python = ">=3.13,<3.14"
dependencies = [
  "numpy==2.3.5",
  "pandas==2.3.3",
  "scipy==1.16.3",
  "torch==2.9.1",
]

[project.optional-dependencies]
plots = ["matplotlib==3.10.7"]

[dependency-groups]
dev = ["pytest==9.0.1", "ruff==0.14.6"]

[project.scripts]
visit-sequences = "transformer_visit_sequences.cli:main"
transformer-visit-sequences = "transformer_visit_sequences.cli:main"

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
